<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>西天梵境琉璃龙壁</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #08080a; 
            font-family: "SimSun", "STSong", "Songti SC", "Noto Serif SC", serif; 
            color: #f2d184;
            touch-action: none;
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            display: block;
        }
        #webcam { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            width: 160px; 
            height: 120px; 
            border-radius: 6px; 
            transform: scaleX(-1); 
            border: 1px solid rgba(242, 209, 132, 0.4); 
            z-index: 10; 
            object-fit: cover;
        }
        #ui { 
            position: absolute; 
            top: 25px; 
            left: 25px; 
            color: #f2d184; 
            z-index: 10; 
            pointer-events: none; 
            max-width: 75vw;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: normal;
            letter-spacing: 3px;
            color: #f8df9f;
            text-shadow: 0 0 10px rgba(242, 209, 132, 0.35);
        }
        .instruction { 
            font-size: 13px; 
            color: #f2d184; 
            margin-top: 4px; 
            background: rgba(242, 209, 132, 0.12); 
            border-left: 2px solid #f2d184;
            padding: 4px 10px; 
            border-radius: 2px; 
            display: inline-block;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .status { 
            color: #f8df9f; 
            font-size: 14px;
            margin-bottom: 8px; 
            letter-spacing: 1px;
            font-weight: bold;
        }
        .status.loading {
            color: #e5a93c;
            animation: blink 1.5s infinite ease-in-out;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #music-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 20;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(20, 18, 15, 0.75);
            border: 1px solid rgba(242, 209, 132, 0.5);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.6);
        }
        #music-btn:hover {
            background: rgba(242, 209, 132, 0.25);
            border-color: #f8df9f;
            transform: scale(1.05);
        }
        #music-btn svg {
            width: 20px;
            height: 20px;
            fill: #f2d184;
        }

        @media (max-width: 768px) {
            #ui { top: 14px; left: 14px; max-width: 70vw; }
            h2 { font-size: 17px; letter-spacing: 1.5px; margin-bottom: 4px; }
            .status { font-size: 11px; margin-bottom: 6px; }
            .instruction { font-size: 10px; padding: 2px 6px; margin-top: 3px; }
            #music-btn { top: 14px; right: 14px; width: 34px; height: 34px; }
            #music-btn svg { width: 16px; height: 16px; }
            #webcam { bottom: 12px; right: 12px; width: 100px; height: 75px; }
        }
    </style>

    <!-- 依赖库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <button id="music-btn" title="音乐开关">
        <svg id="icon-sound" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="icon-mute" viewBox="0 0 24 24" style="display: none;">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
    </button>

    <div id="ui">
        <h2>西天梵境琉璃龙壁</h2>
        <div id="status" class="status loading">正在加载琉璃龙壁资产 (0%)...</div>
        <div><span class="instruction">两指平移：旋转视角</span></div><br>
        <div><span class="instruction">两指捏合 / 张开：缩放模型</span></div><br>
        <div><span class="instruction">五指张开 / 握拳：粒子消散与重组</span></div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <div id="canvas-container"></div>

    <script>
        const statusEl = document.getElementById('status');
        let isModelReady = false; // 模型+贴图全局准备标志

        // --- 0. 音频系统 ---
        const musicBtn = document.getElementById('music-btn');
        const iconSound = document.getElementById('icon-sound');
        const iconMute = document.getElementById('icon-mute');
        const bgm = new Audio('bgm.mp3');
        bgm.loop = true;
        bgm.volume = 0.5;

        function updateMusicUI(playing) {
            iconSound.style.display = playing ? "block" : "none";
            iconMute.style.display = playing ? "none" : "block";
            musicBtn.style.opacity = playing ? "1" : "0.55";
        }

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (bgm.paused) {
                bgm.play().then(() => updateMusicUI(true)).catch(() => {});
            } else {
                bgm.pause();
                updateMusicUI(false);
            }
        });

        // 自动激活音频解锁
        ['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
            window.addEventListener(evt, () => {
                if (bgm.paused) bgm.play().then(() => updateMusicUI(true)).catch(() => {});
            }, { once: true });
        });

        // --- 1. Three.js 场景初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
        camera.position.set(0, 0, 3.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const modelGroup = new THREE.Group();
        
        function getBaseScale() {
            const aspect = window.innerWidth / window.innerHeight;
            return aspect < 1.0 ? Math.max(0.65, aspect * 1.15) : 1.2;
        }

        const INIT_ROTATION_X = (70 * Math.PI) / 180;
        const INIT_ROTATION_Y = (85 * Math.PI) / 180;
        let baseScale = getBaseScale();

        modelGroup.rotation.x = INIT_ROTATION_X;
        modelGroup.rotation.y = INIT_ROTATION_Y;
        modelGroup.scale.set(baseScale, baseScale, baseScale);
        scene.add(modelGroup);

        const activeMaterials = [];

        // --- 2. GPU 粒子着色器材质 ---
        function createParticleShaderMaterial(texture) {
            const isMobile = window.innerWidth <= 768;
            return new THREE.ShaderMaterial({
                uniforms: {
                    uProgress: { value: 0.0 }, 
                    uPointSize: { value: isMobile ? 3.8 : 5.0 },
                    uMap: { value: texture }
                },
                vertexShader: `
                    uniform float uProgress;
                    uniform float uPointSize;
                    attribute vec3 aDirection;
                    attribute vec2 aUv;
                    varying vec2 vUv;

                    void main() {
                        vUv = aUv;
                        vec3 newPosition = position + aDirection * (uProgress * 2.5);
                        newPosition.y += sin(uProgress * 4.0 + position.x * 2.0) * 0.15 * uProgress;

                        vec4 mvPosition = modelViewMatrix * vec4(newPosition, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                        
                        // 视角粒子尺寸衰减
                        gl_PointSize = uPointSize * (300.0 / -mvPosition.z);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uMap;
                    varying vec2 vUv;

                    void main() {
                        // 圆形粒子点裁切
                        vec2 coord = gl_PointCoord - vec2(0.5);
                        if (length(coord) > 0.5) discard;

                        vec4 texColor = texture2D(uMap, vUv);
                        if (texColor.a < 0.1) discard;

                        gl_FragColor = texColor;
                    }
                `,
                transparent: true,
                depthWrite: true,
                depthTest: true
            });
        }

        // --- 3. 模型与材质严格加载器 (解决未加载完成就进入的问题) ---
        const loadingManager = new THREE.LoadingManager();

        loadingManager.onProgress = function(url, itemsLoaded, itemsTotal) {
            const percent = Math.floor((itemsLoaded / itemsTotal) * 100);
            statusEl.innerText = `正在加载琉璃资产与贴图 (${percent}%)...`;
        };

        loadingManager.onLoad = function() {
            isModelReady = true;
            statusEl.classList.remove('loading');
            statusEl.innerText = "✨ 龙壁已就绪，请面对摄像头进行手势互动";
        };

        loadingManager.onError = function(url) {
            statusEl.classList.remove('loading');
            statusEl.style.color = "#ff6b6b";
            statusEl.innerText = `⚠️ 资源载入失败: ${url}，请检查文件是否存在`;
        };

        // 转换网格为粒子系统
        function convertMeshToParticles(mesh, material) {
            const geometry = mesh.geometry;
            if (!geometry || !geometry.attributes.position) return;

            const posAttr = geometry.attributes.position;
            const uvAttr = geometry.attributes.uv;
            const count = posAttr.count;

            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', posAttr.clone());

            if (uvAttr) {
                particleGeo.setAttribute('aUv', uvAttr.clone());
            } else {
                // 如果没有UV生成默认UV
                const dummyUvs = new Float32Array(count * 2);
                particleGeo.setAttribute('aUv', new THREE.BufferAttribute(dummyUvs, 2));
            }

            // 离散方向属性
            const directions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const vx = (Math.random() - 0.5) * 2;
                const vy = (Math.random() - 0.5) * 2;
                const vz = (Math.random() - 0.5) * 2;
                const len = Math.sqrt(vx * vx + vy * vy + vz * vz) || 1;
                directions[i * 3] = vx / len;
                directions[i * 3 + 1] = vy / len;
                directions[i * 3 + 2] = vz / len;
            }
            particleGeo.setAttribute('aDirection', new THREE.BufferAttribute(directions, 3));

            const pointsMesh = new THREE.Points(particleGeo, material);
            pointsMesh.position.copy(mesh.position);
            pointsMesh.rotation.copy(mesh.rotation);
            pointsMesh.scale.copy(mesh.scale);
            modelGroup.add(pointsMesh);
        }

        // 开始加载 MTL 与 OBJ
        const mtlLoader = new THREE.MTLLoader(loadingManager);
        // 如果资源在当前同级目录：
        mtlLoader.load('model.mtl', function(materials) {
            materials.preload();

            const objLoader = new THREE.OBJLoader(loadingManager);
            objLoader.setMaterials(materials);

            objLoader.load('model.obj', function(object) {
                // 居中包围盒计算
                const box = new THREE.Box3().setFromObject(object);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 2.0 / maxDim;

                object.traverse((child) => {
                    if (child.isMesh) {
                        let texture = null;
                        if (child.material) {
                            if (Array.isArray(child.material)) {
                                texture = child.material[0].map;
                            } else {
                                texture = child.material.map;
                            }
                        }
                        
                        const pMat = createParticleShaderMaterial(texture);
                        activeMaterials.push(pMat);

                        // 居中并重置比例
                        child.geometry.center();
                        child.scale.set(scaleFactor, scaleFactor, scaleFactor);

                        convertMeshToParticles(child, pMat);
                    }
                });
            });
        });

        // --- 4. 手势交互与平滑动画控制 ---
        let targetProgress = 0.0;
        let currentProgress = 0.0;
        let targetRotX = INIT_ROTATION_X;
        let targetRotY = INIT_ROTATION_Y;
        let targetScale = baseScale;

        // MediaPipe 手势识别
        const videoElement = document.getElementById('webcam');
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults((results) => {
            if (!isModelReady) return; // 模型未完全载入时不处理手势

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // 1. 获取关键点 (食指指尖, 拇指指尖, 腕部, 掌心)
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];

                // 2. 捏合距离 (食指与拇指) -> 缩放
                const pinchDist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                targetScale = baseScale * THREE.MathUtils.mapLinear(pinchDist, 0.05, 0.3, 0.5, 1.8);

                // 3. 食指位置 -> 旋转
                targetRotY = INIT_ROTATION_Y + (indexTip.x - 0.5) * 2.5;
                targetRotX = INIT_ROTATION_X + (indexTip.y - 0.5) * 1.8;

                // 4. 计算手掌张开度 (五指指尖到手腕平均距离) -> 粒子消散/聚集
                const avgDistToWrist = (
                    Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y) +
                    Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y) +
                    Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y) +
                    Math.hypot(pinkyTip.x - wrist.x, pinkyTip.y - wrist.y)
                ) / 4.0;

                // 张开手掌散开，握拳聚合
                targetProgress = THREE.MathUtils.clamp(
                    THREE.MathUtils.mapLinear(avgDistToWrist, 0.25, 0.55, 0.0, 1.0),
                    0.0, 1.0
                );
            }
        });

        // 启动摄像头
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });
        cameraUtils.start();

        // --- 5. 渲染循环 ---
        function animate() {
            requestAnimationFrame(animate);

            // 缓动插值
            currentProgress += (targetProgress - currentProgress) * 0.08;
            modelGroup.rotation.x += (targetRotX - modelGroup.rotation.x) * 0.08;
            modelGroup.rotation.y += (targetRotY - modelGroup.rotation.y) * 0.08;

            const curS = modelGroup.scale.x;
            const newS = curS + (targetScale - curS) * 0.08;
            modelGroup.scale.set(newS, newS, newS);

            // 更新所有粒子材质的进度
            for (let i = 0; i < activeMaterials.length; i++) {
                activeMaterials[i].uniforms.uProgress.value = currentProgress;
            }

            renderer.render(scene, camera);
        }
        animate();

        // 窗口尺寸自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            baseScale = getBaseScale();
        });
    </script>
</body>
</html>
